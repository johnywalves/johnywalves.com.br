[build]
  command = "npx gatsby clean && npm run build"
  publish = "public"

# A apresentação mostra os slides em iframes da própria página (prévia do controle)
[[headers]]
  for = "/determinismo"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/determinismo/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Endereço antigo da apresentação
[[redirects]]
  from = "/web/determinismo"
  to = "/determinismo"
  status = 301

[[redirects]]
  from = "/web/determinismo/*"
  to = "/determinismo/:splat"
  status = 301
