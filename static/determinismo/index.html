<style>

  /* Barra de blocos */
  .blocks { display: flex; gap: 3px; padding: 0.6rem 1.4rem 0; }

  /* Corpo */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.4rem; padding: 1rem 1.4rem 1.2rem; }

    font-size: 0.85rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;

  }
  .chip.blk-c { color: var(--accent-3); } .chip.crit { color: var(--bad); }
  .chip.time { color: var(--warn); }
  h1 { font-size: 2.4rem; line-height: 1.15; margin: 0.2rem 0 0.9rem; }
  h1 .n { color: var(--accent); }
  .sec { margin-bottom: 1rem; }
  .sec h2 { font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--accent); margin-bottom: 0.3rem; }
  .sec p, .sec li { font-size: 1.35rem; line-height: 1.5; color: var(--text); }
  .sec li { margin-left: 1.3rem; margin-bottom: 0.25rem; }
  .sec.key { background: var(--card); border-left: 0.35rem solid var(--brand); border-radius: 0.6rem; padding: 0.8rem 1rem; }
  .sec.say p { font-size: 1.7rem; line-height: 1.5; font-weight: 600; }
  .sec.visual p { color: var(--muted); }
  .sec.terms { background: var(--card); border-left: 0.35rem solid var(--accent-3); border-radius: 0.6rem; padding: 0.8rem 1rem; }
  .sec.terms h2 { color: var(--accent-3); }
  .sec.terms dt { font-size: 1.35rem; font-weight: 800; color: var(--text); margin-top: 0.4rem; }
  .sec.terms dt:first-child { margin-top: 0; }
  .sec.terms dd { font-size: 1.25rem; line-height: 1.5; color: var(--muted); }

  .side { display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; }
  .nav, .kbd { flex-shrink: 0; }
  .pv h2 { font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--dim); margin-bottom: 0.3rem; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 2px solid var(--border); border-radius: 0.6rem; overflow: hidden; background: var(--bg); }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; flex-shrink: 0; }
  .nextTitle { font-size: 1.1rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }

  .nav { display: flex; gap: 0.6rem; align-items: center; }
  .nav .count { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 5rem; text-align: center; }
  .agenda { flex: 1; min-height: 6rem; overflow-y: auto; background: var(--card); border: 2px solid var(--line); border-radius: 0.7rem; padding: 0.6rem 0.8rem; }
  .agenda h2 { font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--dim); margin-bottom: 0.3rem; }
  .agenda button {
    display: flex; width: 100%; justify-content: space-between; gap: 0.6rem; text-align: left;
    border: 0; border-radius: 0.4rem; background: transparent; padding: 0.25rem 0.4rem; font-weight: 600; font-size: 1rem;
  }
  .agenda button.cur { background: var(--brand); color: #fff; }
  .agenda button .m { color: inherit; opacity: 0.85; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { margin: auto; text-align: center; max-width: 34rem; }
  .empty p { font-size: 1.4rem; line-height: 1.5; margin-bottom: 1.2rem; }
  .kbd { font-size: 0.85rem; color: var(--dim); }
  kbd { border: 1px solid var(--line); background: var(--card); border-radius: 4px; padding: 0 0.35rem; font-family: inherit; font-weight: 700; }
  main { cursor: pointer; }
  .agenda, .nav, .kbd { cursor: default; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; overflow-y: auto; } }
</style>

<script>
const BLOCKS = [
  { id: 1, name: 'Abertura: o paradoxo', min: 8, from: 1, to: 5 },
  { id: 2, name: 'Como LLMs geram texto', min: 10, from: 6, to: 11 },
  { id: 3, name: 'Fontes de não-determinismo', min: 12, from: 12, to: 16 },
  { id: 4, name: 'O espectro do determinismo', min: 10, from: 17, to: 20 },
  { id: 5, name: 'System One: o portão determinístico', min: 15, from: 21, to: 28 },
  { id: 6, name: 'System One + System Two + Especificação', min: 15, from: 29, to: 35 },
  { id: 7, name: 'Estudo de caso ao vivo', min: 8, from: 36, to: 38 },
  { id: 8, name: 'Limites, riscos e ética', min: 5, from: 39, to: 39 },
  { id: 9, name: 'Q&A', min: 7, from: 40, to: 40 },
];

// t: título | crit: slide crítico | key: mensagem-chave | visual | say: fala | extra: detalhes opcionais (lista) | terms: [[termo, explicação]] glossário da 1ª vez que o termo aparece
const SLIDES = [
  { t: 'Capa', crit: 1, visual: 'Título da apresentação, subtítulo, nome do apresentador, evento/data.',
    say: 'Abrir com energia. Não ler o slide. "Hoje vamos falar de uma tensão que todo mundo que coloca IA em produção enfrenta."' },
  { t: 'O paradoxo', key: 'Quanto mais poderosa a IA generativa, mais o mundo exige que ela seja previsível.',
    visual: 'Dois painéis lado a lado, no mesmo estilo dos cards dos outros slides. Esquerda: ícones de cérebro e faíscas, "IA mais criativa". Direita: ícones de cadeado e balança, "Mundo mais exigente por controle". Ícones Lucide (licença ISC), na cor de destaque do tema.',
    extra: ['Âncora opcional, antes da frase de abertura: um caso real de resposta de IA que virou incidente. Candidato: Moffatt v. Air Canada (tribunal canadense, fevereiro de 2024): o chatbot da companhia informou uma regra de tarifa de luto que não existia, o cliente agiu com base nela e a companhia foi condenada a honrar. VERIFICAR antes de usar: confirme data, números e decisão em fonte primária (decisão 2024 BCCRT 149) e cite a fonte no slide. Não consegui checar online nesta sessão.',
            'Se preferir um caso interno, use um seu: o mesmo pedido, respostas diferentes em produção, e a pergunta "qual versão o cliente recebeu e por quê?". Funciona porque liga à falta de auditoria (slide 36).',
            'Slide visual: fica como está. O caso entra só na fala (30 s), sem novo slide, para não mudar a numeração.'],
    say: 'Opcional, 30 s: contar um caso real em que a IA respondeu de forma inconsistente ou inventou uma regra e isso virou prejuízo. Depois: "Nunca tivemos modelos tão capazes de criar. E nunca tivemos tantas exigências de auditoria, compliance e reprodutibilidade."' },
  { t: 'Quem fala',
    key: 'Por que eu falo disso: uso IA todo dia e preciso que ela seja confiável em produção.',
    visual: 'Nome, cargo (engenheiro frontend sênior) e quatro cartões: 20+ anos de experiência; 7 anos com React em escala; mestrado em Deep Learning e IA (em andamento); IA no fluxo diário de entrega. Stack: React, Next.js, TypeScript, Node.js.',
    say: 'Apresentação curta, até 1 minuto, sem ler o slide. Ligar ao paradoxo que acabou de ser mostrado: "Eu uso IA todos os dias para entregar, e é por isso que o problema de variabilidade e controle me interessa." Depois seguir para os dois exemplos contrastantes.' },
  { t: 'Dois exemplos contrastantes',
    visual: 'Split screen. Esquerda, variabilidade é feature: brainstorming de campanha, ideação, design exploratório. Direita, determinismo é requisito: laudo jurídico, parecer financeiro, código em produção, diagnóstico.',
    say: '"A mesma tecnologia, expectativas opostas. O erro comum é tratar as duas com a mesma arquitetura."' },
  { t: 'Tese', crit: 1, key: 'Determinismo é requisito de arquitetura, não parâmetro de modelo.',
    visual: 'Uma frase grande, centralizada. Rodapé: "E o System One é o portão determinístico dessa arquitetura."',
    say: '"Se vocês levarem uma frase hoje, levem esta. Temperature=0 não é arquitetura. E é aí que entra o personagem principal da segunda metade."' },
  { t: 'O pipeline generativo', key: 'Variabilidade nasce nos dois últimos passos: distribuição e amostragem.',
    visual: 'Sete passos em lista, com um exemplo único ("O cliente pode cancelar? Resposta:") que segue até o slide 8. Passos 5 e 6 destacados. Nota pequena no rodapé: os IDs do passo 2 são reais (o200k_base); vetor, atenção e probabilidades são ilustrativos, e as reais aparecem no slide 8.',
    extra: ['1 Prompt: o texto que entra.',
            '2 Tokens: o texto é cortado em pedaços e cada pedaço vira um número (ID).',
            '3 Embeddings: cada ID vira um vetor de números que representa significado.',
            '4 Atenção: cada token pesa quais outros tokens importam para o contexto.',
            '5 Distribuição: o modelo calcula a probabilidade de cada token do vocabulário ser o próximo.',
            '6 Amostragem: um token é sorteado dessa distribuição.',
            '7 Texto: o token entra no contexto e o ciclo repete até terminar.'],
    say: 'Passar rápido pelos passos 1 a 4, é contexto (o próximo slide detalha tokens e embeddings): "Até aqui é matemática determinística, a mesma entrada dá a mesma conta." Desacelerar no 5 e no 6: "O modelo não escreve uma resposta. Ele calcula probabilidades e sorteia um token por vez. O ponto importante está no penúltimo e no último passo."' },
  { t: 'Tokens e embeddings', key: 'Tokens e embeddings são conta fixa. A variabilidade só nasce depois, na distribuição e na amostragem.',
    visual: 'DADOS REAIS (etiqueta no topo: tokens e IDs medidos com o tokenizador o200k_base da OpenAI). A caixa de embeddings leva a marca "ilustrativo" no título. Duas caixas. Esquerda, Tokens: a frase "O cliente pode cancelar? Resposta:" cortada em 8 pedaços, cada um com seu ID real (46, 23508, 9684, 169134, 30, 2317, 22686, 25) e três pontos: tabela fixa, pedaço não é palavra ("Resposta" = Res + posta), o espaço conta. Direita, Embeddings: cancelar, encerrar (perto) e banana (longe) com vetores curtos, e dois pontos: cada ID vira um vetor; sentido parecido, vetores próximos. Nota: "Até aqui é conta fixa: mesma entrada, mesmos tokens, mesmos vetores."',
    terms: [['Token', 'Pedaço de texto que o modelo trata como uma unidade. Pode ser uma palavra, parte de uma palavra, um espaço com palavra ou um sinal. O modelo nunca vê letras, só os IDs dos tokens.'],
            ['Tokenizador', 'A tabela fixa que corta o texto em tokens e dá um ID a cada um. Cada família de modelo tem o seu, então o mesmo texto vira IDs diferentes em modelos diferentes.'],
            ['Embedding (vetor)', 'Lista de números que representa o sentido de um token. Palavras de sentido parecido ficam com vetores parecidos. É assim que a máquina "mede" que cancelar e encerrar são próximos.']],
    extra: ['Tokens medidos com o tokenizador o200k_base (família GPT-4o, da OpenAI), pacote gpt-tokenizer. "O cliente pode cancelar? Resposta:" dá 8 tokens: "O", " cliente", " pode", " cancelar", "?", " Res", "posta", ":" com IDs 46, 23508, 9684, 169134, 30, 2317, 22686, 25.',
            'Ressalva: Llama, Claude e Gemini usam outros tokenizadores. Os IDs e a divisão mudam de modelo para modelo. O que não muda é a ideia: tabela fixa.',
            'O espaço faz parte do token: " cancelar" (com espaço) é 1 token, o ID 169134. "cancelar" sem espaço dá 2 tokens ("cancel" + "ar"). Também medido com o o200k_base.',
            'Os vetores da caixa de embeddings são ILUSTRATIVOS (valores inventados, só para mostrar perto e longe). Não vêm de um modelo real. O slide diz isso com a marca "ilustrativo" no título da caixa. Se quiser um número real, use a API de embeddings de um provedor e calcule a similaridade.',
            'Dimensão real: varia por modelo, de centenas a milhares de números por token. O slide diz "centenas ou milhares".',
            'Ligação com a tese: tokenizador e embeddings são determinísticos. A variabilidade nasce nos passos 5 e 6 (slide seguinte e demo).',
            'Tempo: cerca de 1 a 1,5 min. É o slide para cortar se o bloco 2 estourar.'],
    say: '"Antes de falar de probabilidade, um minuto sobre dois passos. Primeiro, o modelo não lê letras. Um tokenizador, que é uma tabela fixa, corta o texto em pedaços e dá um número a cada um. Estes IDs são reais: reparem que Resposta virou dois pedaços e que o espaço conta. Segundo, cada número vira um vetor, uma lista de números que representa o sentido. Cancelar e encerrar ficam perto, banana fica longe. Estes vetores são ilustrativos. O ponto: até aqui é conta fixa. A mesma entrada dá os mesmos tokens e os mesmos vetores. A variabilidade vem depois."' },
  { t: 'A distribuição de probabilidade', key: 'O modelo não "escolhe a resposta certa". Ele amostra de uma distribuição.',
    visual: 'DADOS REAIS (etiqueta no topo, coletados em 20/10/2026): barras com a probabilidade real do primeiro token no Llama 4 Maverick, média de 50 chamadas, e dois selos com o que foi sorteado. Prompt na tela: "Complete com uma única palavra: Paris é uma cidade muito".',
    extra: ['Dados: experimento/results.logprobs-aberta.json. Probabilidades vêm de logprobs (top 10 tokens). Barras são a média das 50 chamadas: "bon" 86,9%, "Bon" 11,6%, "l" 0,5%, "L" 0,3%, outros 0,8%.',
            'Sorteio com temperature=1: "bon" 45 vezes e "Bon" 5 vezes em 50. Isso é ~90/10, perto da distribuição.',
            'Ponto de atenção: a probabilidade de "bon" não é igual em chamadas idênticas: 83,4% em 29 chamadas e 91,7% em 21. É o efeito da fonte 1 (GPU e batching) visível no próprio logprobs. Se perguntarem, use isso.',
            'Escolha do prompt (seleção declarada): rodei 4 prompts antes de escolher. "O cliente pode cancelar? Resposta:" deu "Sim" 99,95%; "Escolha uma cor…" deu "azul" 99,2%; "Dê um nome para um café…" deu "C" 95,2%. Todos concentrados demais. Fiquei com o de Paris porque é o único em que a distribuição se espalha. Arquivos: results.logprobs-fechada/-cor/-nome.json.',
            'Só o Llama devolve logprobs: GPT 6.1 Sol rejeita o parâmetro e o Gemini não os retorna. Provedor fixado: Parasail. Um modelo, um prompt: ilustra o conceito, não generaliza.',
            'Os números antigos do slide (sim 42%, não 23%…) eram ilustrativos e foram removidos.'],
    say: '"Aqui nasce toda a variabilidade. Não é bug, é o design. Isto é real: perguntei cinquenta vezes ao mesmo modelo. A probabilidade fica quase toda em uma palavra, mas não toda. E repare: a probabilidade em si já muda entre chamadas idênticas."' },
  { t: 'Temperatura, top-p, top-k',
    visual: 'Três mini-gráficos mostrando o efeito de cada parâmetro. Tabela: temperature=0 (greedy/argmax, parece mas não garante), top-p (nucleus sampling, não), top-k (limita ao top k, não).',
    terms: [['Temperatura (temperature)', 'Botão que controla o quanto o sorteio do próximo token se espalha. Baixa: favorece muito os mais prováveis. Alta: dá chance a tokens improváveis. Com 0 não há sorteio, o modelo pega o mais provável.'],
            ['Greedy / argmax', 'Estratégia "gulosa": em cada passo escolhe sempre o token de maior probabilidade, sem sortear. Argmax é o nome da operação matemática que devolve o item de maior valor. Parece determinístico, mas empates e arredondamentos de GPU ainda podem trocar o token.'],
            ['Top-p (nucleus sampling)', 'Em vez de olhar todo o vocabulário, junta os tokens mais prováveis até somar p da probabilidade (ex.: p = 0,9) e sorteia só dentro desse "núcleo". Reduz o improvável, mas continua sorteando, então não garante determinismo.'],
            ['Top-k', 'Mantém só os k tokens mais prováveis (ex.: k = 40) e sorteia entre eles. Limita as opções, mas o sorteio continua, então também não garante determinismo.']],
    say: '"Temperature=0 pega sempre o token mais provável. Parece determinístico. Mas..."' },
  { t: 'Demo: mesma pergunta, temperaturas diferentes',
    visual: 'DADOS REAIS (etiqueta "Dados reais" no topo, coletados em 20/10/2026): 10 execuções da mesma pergunta aberta no Llama 4 Maverick, temperature=0 e temperature=1 lado a lado, com SHA-256 e placar de iguais à execução 1. Roda uma vez (~20 s) e o resultado final fica na tela; ao sair e voltar, repete. Backup: vídeo gravado.',
    extra: ['Dados: experimento/results.temperatura-aberta.json. Prompt: "Descreva Paris em uma frase." Uma chamada por execução, sem retentativa e sem descartar saída.',
            'Resultado: com temperature=0, 9 de 10 execuções idênticas (só a nº 6 trocou frase) e 2 textos no total. Com temperature=1, 10 execuções, 10 textos diferentes e só a própria execução 1 igual a ela mesma.',
            'Leitura: temperatura alta espalha a saída; temperatura zero concentra, mas NÃO garante (a execução 6 saiu diferente). É a ponte para o bloco 3.',
            'Escolha do prompt: primeiro rodei "Qual é a capital da França? Responda em uma frase." (results.temperatura.json). Pergunta fechada demais: Gemini e Llama deram 1 texto nas duas temperaturas e o Claude, 2 textos nas duas. Então troquei por uma pergunta aberta e congelei antes de rodar. Se perguntarem, diga isso.',
            'Na pergunta aberta: Llama deu 2 textos em t=0 e 10 em t=1. Gemini deu 10 e 10; Claude deu 10 e 8. Gemini e Claude não ficaram determinísticos em t=0 (o parâmetro pode ter sido ignorado pelo roteador no Claude; não foi confirmado). O slide usa o Llama porque é o que mostra o contraste com clareza, e a nota diz isso.',
            'Provedor do Llama nesta rodada: Parasail, fixado. Os 3 modelos que aceitam temperature foram rodados; nenhum foi descartado depois de ver o resultado, mas a escolha do Llama para o slide foi feita olhando os resultados.'],
    say: '"Mesma pergunta, dez vezes. Com temperature=0, quase sempre o mesmo texto; com temperature=1, dez textos diferentes. Mas repare na execução seis: mesmo com temperature=0, saiu diferente. Isto não é simulação: são execuções reais, coletadas em 20 de outubro de 2026. Por quê? Próximo bloco."' },
  { t: 'Transição', visual: 'Slide minimalista com uma pergunta: "Temperature=0 resolve?" e a resposta "Não. E a razão é mais profunda do que parece."',
    say: 'Criar expectativa para o bloco 3.' },

  { t: 'Três fontes, não uma', crit: 1,
    visual: 'Três ícones/camadas empilhadas: Hardware/GPU (não-associatividade de ponto flutuante + batching dinâmico); Interpretação (deriva de interpretação da tarefa); Saída (espaço de saída livre).',
    terms: [['GPU', 'Placa de vídeo usada para rodar o modelo. Faz milhares de contas em paralelo, e a ordem em que cada conta termina pode mudar de uma execução para outra.'],
            ['Batching', 'Agrupar vários pedidos de usuários diferentes e processar juntos, para aproveitar melhor a GPU. O tamanho e a composição do grupo mudam a cada momento em produção.'],
            ['Ponto flutuante', 'Forma como o computador guarda números decimais, com arredondamento. Somar na ordem A+B+C pode dar um resultado minimamente diferente de C+B+A (não-associatividade), e essa diferença pode virar outro token.']],
    say: '"A maioria só conhece a primeira. A segunda é a mais subestimada."' },
  { t: 'Fonte 1: GPU e batching', key: 'A ordem de acumulação depende do batch. O batch varia em produção. A saída varia.',
    visual: 'Diagrama simples de acumulação de ponto flutuante em ordem diferente conforme o batch.',
    say: '"Mesma entrada, mesmo modelo, mesmo temperature=0. Execuções diferentes, saídas diferentes. Isso é real e mensurável."' },
  { t: 'Fonte 2: deriva de interpretação', crit: 1,
    key: 'Engenharia de prompt ajusta a probabilidade de escolha dentro do espaço de interpretação. Não elimina a diversidade de interpretações.',
    visual: 'Pergunta ambígua no topo e três interpretações em paralelo, cada uma com resposta coerente internamente, mas incompatíveis entre si.',
    say: '"Este é o ponto mais importante do bloco. O modelo pode estar \'certo\' em três sentidos diferentes. Prompt não resolve isso."' },
  { t: 'Fonte 3: espaço de saída livre', key: 'Mesmo com temperature=0, texto livre permite variação de formato e desvio semântico.',
    visual: 'Três saídas válidas para o mesmo pedido, em formatos diferentes: JSON, prosa, lista.',
    say: '"Se a saída é texto livre, o determinismo funcional é impossível por construção."' },
  { t: 'Síntese do bloco',
    visual: 'Tabela. GPU/batching: parâmetro não, arquitetura parcialmente. Deriva de interpretação: parâmetro não, arquitetura sim (especificação). Espaço de saída: parâmetro não, arquitetura sim (System One).',
    say: '"Nenhuma das três se resolve só com temperature=0. Todas se resolvem, ou se mitigam, na arquitetura. É a ponte para o próximo bloco."' },

  { t: 'Determinismo não é binário', key: 'A pergunta certa não é "é determinístico?", é "qual nível de determinismo esta tarefa exige?"',
    visual: 'Espectro horizontal com três marcadores: Bit-exato, Funcional, Estatístico.',
    say: '"A pergunta certa não é \'é determinístico?\', é \'qual nível de determinismo esta tarefa exige?\'"' },
  { t: 'Os três níveis',
    visual: 'Tabela. Bit-exato: mesmo hash SHA-256, reprodutibilidade científica, custo altíssimo. Funcional: mesma decisão/ação, roteamento/laudo/código, custo médio. Estatístico: mesma distribuição, ideação/recomendação, custo baixo.',
    say: '"Bit-exato raramente é necessário. Funcional quase sempre é. Estatístico é o default da indústria hoje."' },
  { t: 'Escolha o nível certo', visual: 'Matriz 2×2. Linhas: erro grave se variar (sim/não). Colunas: variabilidade desejada (sim/não). Cada célula tem nível, o que significa e um exemplo.',
    extra: ['Crítico + variar é desejado: Funcional. Decisão fixa, redação livre. Ex.: laudo, parecer.',
            'Crítico + variar não é desejado: Bit-exato. Saída idêntica byte a byte. Ex.: reprodutibilidade científica.',
            'Não crítico + variar é desejado: Estatístico. Mesma distribuição. Ex.: ideação, recomendação.',
            'Não crítico + variar não é desejado: Funcional. Mesma ação, custo médio. Ex.: roteamento, extração.'],
    say: '"Forçar bit-exato onde não precisa é caro. Aceitar estatístico onde precisa é irresponsável."' },
  { t: 'Transição', crit: 1, key: 'Como chegar ao determinismo funcional? Com um portão determinístico na arquitetura: o System One.',
    visual: 'Frase central.', say: 'Virar a chave da apresentação. A partir daqui, System One é o protagonista.' },

  { t: 'O que é System One (definição)', crit: 1, key: 'Sistema de execução de decisão local e não generativo: um portão de controle antes do LLM.',
    visual: 'Caixa de definição destacada. "System One aqui não é o pensamento rápido cognitivo de Kahneman. É um sistema de execução de decisão local e não generativo, na camada de arquitetura. Decide de forma determinística por regras predefinidas, classificadores de intenção e mecanismos de auditoria."',
    terms: [['Kahneman', 'Daniel Kahneman, psicólogo e Nobel de Economia (2002), autor de "Rápido e Devagar". Propôs dois modos de pensar: o Sistema 1, rápido, intuitivo e automático, e o Sistema 2, lento, deliberado e analítico. É uma teoria sobre a mente humana.'],
            ['System One (aqui)', 'Nome emprestado, conceito diferente. Não é intuição nem "pensamento rápido": é um componente de software que decide por regras predefinidas, sem gerar texto, antes do LLM. O único ponto em comum é a ideia de uma camada rápida que roda antes de outra mais lenta e deliberada.'],
            ['System Two (aqui)', 'Também só compartilha o nome. É a camada de execução com LLM: raciocínio em etapas, decomposição e chamada de ferramentas, dentro do espaço que o System One delimitou.']],
    say: 'Desambiguar explicitamente. "Se você conhece Kahneman, esqueça por um momento. O nome é o mesmo, o conceito é outro."' },
  { t: 'Função 1: espaço aberto → espaço fechado', crit: 1,
    key: '"Smart if-statements": classificação em enumeração predefinida. Mesma entrada + mesmo modelo + parâmetros fixos = mesma decisão.',
    visual: 'Funil. Entrada livre ("quero cancelar minha assinatura e pedir reembolso do mês passado") → classificação determinística → [billing_agent, tech_support, security_review].',
    say: '"Em vez de deixar o LLM gerar livremente uma tag de intenção, o System One classifica em um conjunto finito. Determinístico por construção."' },
  { t: 'Função 2: auditoria (ActionLedger)', crit: 1,
    key: 'Reconstruibilidade e invariância de ordem: dá para provar o que foi decidido, e a decisão não depende da posição das opções.',
    visual: 'Fluxo: decisão → registro no ledger → verificação de correspondência → execução. Bullets: Reconstruibilidade (rastrear decisão até política e entrada). Invariância de ordem (a decisão não muda quando a ordem das opções muda). Dois selos "Ilustrativo": [billing, tech, security] → billing e [security, billing, tech] → billing. Nota pequena: LLMs tendem a favorecer a primeira ou a última opção; se embaralhar a lista muda a decisão, ela depende da posição, não do conteúdo.',
    extra: ['Removido: o termo "PICA" e o número "0% de viés de ordem". Não achei a fonte, então saíram do deck. Se achar a referência, volte com a citação.',
            'Os dois selos de exemplo são ILUSTRATIVOS, não medidos. Servem só para mostrar o que o teste de ordem verifica.',
            'Como testar na prática: rode a mesma mensagem com as opções em ordens diferentes (3 opções dão 6 ordens) e compare a decisão. Se alguma ordem muda a escolha, há viés de posição.',
            'Viés de posição de LLMs (preferir a primeira ou a última opção) é um efeito descrito na literatura de avaliação de modelos, mas não citei artigo específico aqui. Se perguntarem, diga que é um efeito conhecido e que você pode medir no seu caso.'],
    terms: [['Ledger', 'Livro-razão: registro sequencial, só de acréscimo, de tudo o que foi decidido. Cada linha guarda entrada, política aplicada, decisão, hash e horário.'],
            ['ActionLedger', 'O ledger do System One. A ação só é executada se a decisão corresponder exatamente ao que está registrado, por isso dá para reconstruir e auditar depois.'],
            ['Invariância de ordem', 'Propriedade em que embaralhar as opções não muda a decisão. Se muda, o modelo está escolhendo pela posição (primeira ou última), não pelo conteúdo. É a forma de checar viés de posição.']],
    say: '"A ação só executa se a decisão corresponder exatamente ao registro. Isso é auditabilidade real, não log de texto. E tem uma segunda propriedade: invariância de ordem. Se eu embaralho a lista de opções e a decisão muda, ela dependia da posição, não do conteúdo. Modelos tendem a favorecer a primeira ou a última opção. O teste é simples: troque a ordem e compare."' },
  { t: 'Função 3: limitação do espaço de saída', key: 'Fecha a entrada (função 1) e fecha a saída.',
    visual: 'DADOS REAIS (etiqueta "Dados reais" no topo, coletados em 20/10/2026): tabela com os 3 tipos de pergunta do System One (Jev 1.13). Cada linha tem o tipo, a pergunta e o retorno permitido, com valor real. Abaixo, três selos com o resultado de 40 chamadas idênticas. Rodapé: "Nunca texto livre".',
    extra: ['Mensagem: "quero cancelar e pedir reembolso do mês passado". 40 chamadas idênticas, sem retentativa. Dados: experimento/results.jev.json. Modelo: typesafe/jev-1.13-20260917.',
            'choice: "Qual é a intenção do cliente?" → "billing_agent" (um item da lista). 40 de 40 idênticos, com probabilidade 1 e confiança 1. É o único tipo totalmente repetível.',
            'noul: "O cliente pede uma ação urgente?" → número de 0 a 1 (0,35 aqui). Variou de 0,33 a 0,37 (5 valores) nas 40 chamadas.',
            'score: "Quão urgente é o pedido?" → número de 0 a 1 entre critérios dados (0,74 aqui). Variou de 0,66 a 0,78 (11 valores). Devolve também probabilities e confidence.',
            'Leitura honesta: o espaço de saída é fechado (nunca texto livre) e a decisão discreta é estável, mas os números contínuos têm ruído pequeno. Por isso o sistema decide por limiar, não por igualdade de número. Se perguntarem, diga isso.',
            'O tipo box existe na API (aparece no validador), mas não consegui o formato; ficou fora do slide. Antes este slide mostrava range_eval, set_choice e null: não são tipos reais da API.'],
    terms: [['noul', 'Tipo de pergunta do System One que responde sim ou não com um número de 0 a 1: perto de 1 é "sim", perto de 0 é "não".']],
    say: '"Espaço de saída limitado impede que o modelo \'invente\'. A pergunta de classificação voltou igual nas quarenta vezes. Os números têm um ruído pequeno, e é por isso que a decisão usa limiar. É o complemento da função 1: fecha a entrada e fecha a saída."' },
  { t: 'Função 3: a chamada', crit: 0,
    key: 'A pergunta já traz as respostas permitidas. O modelo só escolhe dentro delas.',
    visual: 'CHAMADA REAL (etiqueta no topo): o corpo JSON enviado nas 40 chamadas, copiado de experimento/run-jev.mjs. Uma mensagem ("quero cancelar e pedir reembolso do mês passado") e três perguntas: urgente (noul), intencao (choice, com as 3 opções e suas descrições) e grau (score, com 3 critérios). Linha de cima: POST com o cabeçalho Authorization mascarado (***). Nota: "Uma mensagem, três perguntas, respostas só dentro do que foi listado."',
    extra: ['Fonte: experimento/run-jev.mjs. Endpoint e chave vêm de JEV_API_URL e JEV_API_KEY no .env (ignorado pelo Git). A chave NUNCA aparece no slide.',
            'Corpo: { model: "openrouter/typesafe/jev-1.13", state, questions }. A mesma chamada foi repetida 40 vezes, sem retentativa e sem mudar nada.',
            'O ponto é o criteria do choice: billing_agent, tech_support e security_review. O modelo não pode devolver uma quarta opção. É isso que fecha o espaço de saída.',
            'Os três tipos nesta chamada: noul (sim ou não como número), choice (um item da lista) e score (número entre critérios). O tipo box existe na API, mas não está aqui.'],
    say: '"Esta é a chamada de verdade, sem retoque. Uma mensagem do cliente e três perguntas. Reparem na de intenção: eu já entrego as três respostas possíveis. O modelo não tem como inventar uma quarta."' },
  { t: 'Função 3: a resposta', crit: 0,
    key: 'A decisão discreta repete nas 40 chamadas. O número contínuo tem ruído pequeno, por isso a decisão usa limiar.',
    visual: 'RESPOSTA REAL (etiqueta no topo): a execução 6 de 40, de experimento/results.jev.json. Linha de cima: 200 OK, modelo typesafe/jev-1.13-20260917, ~0,35 s. JSON: urgente 0.35; intencao billing_agent com probabilidades 1/0/0 e confiança 1; grau 0.74 com probabilidades 0.27/0.73/0 e confiança 0.59. Rodapé em comentário: campos "type" e "legend" omitidos para caber. Três selos: 40/40 intencao idêntica, 0,33–0,37 urgente, 0,66–0,78 grau.',
    extra: ['Fonte: experimento/results.jev.json. Escolhi a execução 6 porque bate com os valores do slide anterior (noul 0,35 e score 0,74). As execuções 9 e 36 também batem. É um exemplo, não a média.',
            'choice: billing_agent nas 40 de 40, com probabilidade 1 e confiança 1. É o único tipo totalmente repetível.',
            'noul: variou de 0,33 a 0,37 (5 valores). score: variou de 0,66 a 0,78 (11 valores).',
            'Leitura honesta: o espaço de saída é fechado e a decisão discreta é estável. Os números contínuos têm ruído pequeno, e por isso o sistema decide por limiar, não por igualdade de número. Se perguntarem, diga isso.',
            'Latência do portão nesta rodada: mediana 359 ms em 40 chamadas.',
            'Os nomes das chaves (urgente, intencao, grau) são os que eu defini na chamada; o slide anterior os chama pelos tipos (noul, choice, score).'],
    say: '"E esta é a resposta. A intenção veio igual nas quarenta vezes: billing_agent, probabilidade um. Os números têm um ruído pequeno, de 0,33 a 0,37 e de 0,66 a 0,78. Por isso eu decido por limiar, nunca por igualdade exata."' },
  { t: 'O que o System One troca', key: 'Confiabilidade tem preço: latência, manutenção e fallback. E dá para medir.',
    visual: 'DADOS REAIS (etiqueta no topo, coletados em 20/10/2026): dois cartões, Ganha (confiabilidade, auditabilidade, determinismo funcional) e Perde (flexibilidade, latência extra, manutenção da taxonomia, fallback). Embaixo, dois selos: ~0,35 s mediana do portão e 2,9 a 4,2 s mediana de uma chamada ao LLM. A taxa de fallback e as métricas ficam no slide 33.',
    extra: ['Latência do portão: mediana 359 ms em 40 chamadas (results.jev.json, p95 476 ms) e 351 ms em 72 chamadas (results.jev-roteamento.json, p95 441 ms, máx. 642 ms). Selo arredondado: ~0,35 s em 112 chamadas.',
            'Latência do LLM: mediana por modelo no grupo com especificação: GPT 6.1 Sol 2,9 s, Claude Sonnet 5.5 3,0 s, Llama 4 Maverick 3,2 s, Gemini 3.8 Flash 4,2 s (results.gpt61/claude/run1.json, 9 a 10 chamadas por modelo). Sem especificação (texto livre) as medianas sobem para 5,7 a 12,1 s, porque a saída é longa.',
            'Ressalva: medi de uma máquina local por rotas diferentes (OpenRouter, OpenAI direta e roteador local), em rodadas separadas. Servem como ordem de grandeza, não como benchmark. O portão custa ~0,35 s; evitar uma chamada ao LLM em mensagem de Média ou Baixa compensa, mas só no fluxo certo.',
            'Custo: o Jev gastou US$ 0,0000175 por chamada (results.jev.json). Custo maior é o humano: manter a taxonomia, os limiares (0,90 e 0,60) e o fallback ao longo do tempo.',
            'Como medir (as três métricas aparecem no slide 33, com os mesmos dados): taxa de fallback = Média + Baixa, aqui 10 de 24. Acerto na faixa Alta = 14 de 14 corretas, com a ressalva de que confiança alta não é prova de acerto. Estabilidade = mesma intenção nas 3 repetições em 24 de 24 mensagens.',
            'Em produção: registre cada decisão no ledger e revise uma amostra da faixa Alta, não só as de fallback.'],
    say: '"Nada é de graça. Ao limitar o espaço de decisão, ganha-se confiabilidade e perde-se flexibilidade. O portão custa cerca de um terço de segundo, o LLM leva de três a quatro. O custo maior é manter a taxonomia viva. E dá para medir, e já mostro como no roteamento. O fallback é obrigatório."' },
  { t: 'Síntese do bloco', key: 'System One não gera. Ele decide, registra e limita.',
    visual: 'Três funções em três colunas, com uma frase de fechamento embaixo.',
    say: '"Guardem essas três palavras: decide, registra, limita."' },

  { t: 'A arquitetura em 3 camadas', crit: 1,
    visual: 'Tabela central da apresentação, em slide grande. Entrada (System One) · Especificação determinística · Execução (System Two), com colunas Mecanismo, Resolve, Não resolve.',
    extra: ['Entrada: resolve ambiguidade, desvio de roteamento e injeção. Não resolve raciocínio lógico complexo.',
            'Especificação: resolve deriva de interpretação e variância entre modelos. Não resolve execução de um modelo específico.',
            'Execução: resolve raciocínio em etapas e uso de ferramentas. Não resolve determinismo em nível de token.'],
    say: '"Este é o slide que vocês devem fotografar. Cada camada resolve o que a outra não resolve."' },
  { t: 'Especificação: o que os modelos recebem', crit: 1,
    key: 'Especificação = política em linguagem natural (fecha o sentido) + schema estrito (fecha a forma). Foi o que os 4 modelos receberam.',
    visual: 'REQUISIÇÃO REAL (etiqueta no topo): duas colunas, copiadas de experimento/run.mjs. Esquerda: a política (prompt de sistema) billing.cancellation.v3, com o que significam "cancelar" e "reembolso do mês passado", as intenções e ações permitidas. Direita: o corpo da requisição (messages, response_format com json_schema estrito, temperature 0). Nota: "Política fecha o sentido. Schema fecha a forma. Sem isso, o controle recebia só: Responda ao cliente."',
    terms: [['Política (prompt de sistema)', 'Texto fixo, escrito por você, que diz ao modelo o que cada palavra do pedido significa e quais valores são permitidos. É a parte "em linguagem natural" da especificação.'],
            ['Schema estrito (json_schema, strict)', 'Descrição formal do JSON aceito: quais campos existem e quais valores cada um pode ter (enum). Com strict ligado, a API recusa qualquer saída fora dele. É a parte que fecha a forma da resposta.']],
    extra: ['Fonte: experimento/run.mjs (SPEC_SYSTEM e SPEC_SCHEMA), gravada em results.gpt61.json em prompts.specSystem e prompts.specSchema. A mesma especificação foi enviada aos 4 modelos.',
            'A política foi encurtada no slide ("cancelar" = ...) mas o conteúdo é o mesmo do texto original: "cancelar" significa encerrar a assinatura ao fim do ciclo atual; "reembolso do mês passado" significa reembolsar o ciclo de cobrança anterior.',
            'temperature: 0 vai nos modelos que aceitam (Claude, Gemini, Llama). GPT 6.1 Sol só aceita o padrão e não recebe o parâmetro, então nele a convergência vem do schema e da política. Está dito no slide.',
            'Grupo de controle (o contraponto do slide seguinte): mesmo modelo, mesma mensagem, prompt de sistema "Você atende clientes de uma assinatura. Responda ao cliente." e sem schema. Resultado: 40 respostas, 40 textos diferentes.',
            'O termo "substrato de restrições" foi trocado por "política + schema estrito" na tabela de arquitetura e no achado, porque é jargão não explicado.',
            'A chave de API não aparece; cada rota usa a sua variável do .env.'],
    say: '"Antes do resultado, o que eu mandei. À esquerda, a política: eu digo o que cancelar e reembolso significam e quais são as únicas intenções e ações possíveis. À direita, o schema: o JSON só pode ter estes campos e estes valores. Essa é a especificação: sentido fechado e forma fechada. Os quatro modelos receberam exatamente isso. O controle recebeu só: responda ao cliente."' },
  { t: 'O achado que muda tudo', crit: 1,
    key: 'Após a especificação reduzir múltiplas interpretações a uma única, 4 modelos de fronteira diferentes tomam a mesma decisão. 3 deles geram o mesmo JSON, byte a byte.',
    visual: 'Frase de impacto em golpes: contexto pequeno; "4 modelos de fronteira diferentes"; "tomam a mesma decisão." Depois, grade 4 linhas x 10 colunas = 40 execuções reais (GPT 6.1 Sol, Claude Sonnet 5.5, Gemini 3.8 Flash, Llama 4 Maverick). Células azuis: JSON idêntico byte a byte (30). Roxas: mesma decisão, chaves em outra ordem (Llama, 9). Tracejada: falha 429 do provedor (1). Contadores: 30/40 idênticas byte a byte e 39/40 com a mesma decisão. Selo: "Sem a especificação: 0 de 40 repetidas". Por último o SHA-256 completo é digitado. Roda uma vez (~14 s) e o resultado final fica na tela; ao sair e voltar ao slide, repete.',
    extra: ['Dados reais: experimento/results.gpt61.json, results.claude.json e results.run1.json (Gemini e Llama). Cada chamada é única, sem retentativa e sem descartar saída.',
            'Tarefa: "quero cancelar e pedir reembolso do mês passado", política billing.cancellation.v3, saída em JSON com schema estrito (intent, actions, refund_cycle).',
            'GPT 6.1 Sol, Claude Sonnet 5.5 e Gemini 3.8 Flash (OpenAI, Anthropic, Google): 30 de 30 JSONs idênticos. Mesmo SHA-256: 0ff2f850...b5a3f.',
            'Llama 4 Maverick (Meta): 7 execuções com chaves em uma ordem e 2 em outra, mesmo conteúdo. 1 execução falhou com 429 do provedor e não foi refeita.',
            'Controle sem especificação (texto livre): 40 respostas, 40 textos diferentes.',
            'Ressalvas para falar se perguntarem: (1) GPT 6.1 Sol só aceita temperatura padrão, então nele a convergência vem do schema e da especificação, não de temperature=0. (2) Os modelos vieram por 3 rotas (OpenAI direta, OpenRouter e um roteador local) em rodadas separadas. (3) É um experimento pequeno, com uma única tarefa.'],

const TOTAL = SLIDES.length;
// A pasta pode ser servida como /determinismo (sem barra, como no Netlify), /web/determinismo/ ou .../index.html
const SLIDES_URL = (() => {
  const dir = location.pathname.replace(/\/(index\.html)?$/, '').replace(/\/?$/, '/');
  return location.origin === 'null' || location.protocol === 'file:'
    ? new URL('slides.html', location.href).href
    : location.origin + dir + 'slides.html';
})();
const KEY = 'determinismo-presenter-v1';

const TOTAL_MIN = 90;
const blockOf = n => BLOCKS.find(b => n >= b.from && n <= b.to);
// minuto esperado no início de cada slide (bloco dividido igualmente entre seus slides)
let cum = 0;
const startMin = [];
BLOCKS.forEach(b => {
  const cnt = b.to - b.from + 1;
  for (let i = 0; i < cnt; i++) startMin[b.from - 1 + i] = cum + b.min * i / cnt;
  cum += b.min;
});
const slideMin = n => { const b = blockOf(n + 1); return b.min / (b.to - b.from + 1); };
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const s = Math.floor(Math.abs(ms) / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
const fmtMS = ms => { const s = Math.floor(Math.abs(ms) / 1000); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ---------- estado ----------
let st = { idx: 0, acc: 0, since: null, blockEnter: 0 };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
if (st.idx >= TOTAL || st.idx < 0) st.idx = 0;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const elapsed = () => st.acc + (st.since ? Date.now() - st.since : 0);
const running = () => !!st.since;

function start() { if (!running()) { st.since = Date.now(); save(); renderBtn(); } }
function pause() { if (running()) { st.acc = elapsed(); st.since = null; save(); renderBtn(); } }
function renderBtn() { $('startBtn').textContent = running() ? 'Pausar' : (st.acc > 0 ? 'Continuar' : 'Iniciar'); }

// ---------- tema ----------
function applyTheme() {
  let t = null; try { t = localStorage.getItem('theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.body.className = t;
}
applyTheme();
window.addEventListener('storage', e => { if (e.key === 'theme') applyTheme(); });
$('themeBtn').onclick = () => {
  const t = document.body.classList.contains('light') ? 'dark' : 'light';
  try { localStorage.setItem('theme', t); } catch (e) {}
  applyTheme();
};

// ---------- janela dos slides ----------
let win = null;
let channel = null;
try { channel = new BroadcastChannel('determinismo-deck'); } catch (e) {}

function winAlive() { return win && !win.closed; }
function openSlides() {
  if (winAlive()) { win.focus(); return; }
  const w = Math.min(screen.availWidth, 1600), h = Math.min(screen.availHeight, 900);
  // se houver segundo monitor, o navegador posiciona; a janela pode ser arrastada e F entra em tela cheia
  win = window.open(`${SLIDES_URL}?slide=${st.idx + 1}`, 'determinismo-slides',
    `popup=yes,width=${w},height=${h},left=${screen.availLeft || 0},top=${screen.availTop || 0}`);
  if (!win) alert('O navegador bloqueou a janela. Permita pop-ups para este site e clique em "Abrir slides" de novo.');
  renderConn();
}
function sendToSlides() {
  const msg = { dsh: 'goto', idx: st.idx };
  if (channel) channel.postMessage(msg);
  if (winAlive()) win.postMessage(msg, '*');
}
function renderConn() {
  const on = winAlive();
  $('conn').textContent = on ? 'slides abertos' : 'slides fechados';
  $('conn').classList.toggle('on', on);
  $('openBtn').textContent = on ? 'Focar slides' : 'Abrir slides';
}
setInterval(renderConn, 1000);

function onRemote(d) {
  if (!d) return;
  if (d.dsh === 'sync') go(d.idx, true);
  else if (d.dsh === 'hello') sendToSlides();
}
if (channel) channel.onmessage = e => onRemote(e.data);
window.addEventListener('message', e => { if (e.source && e.source === win) onRemote(e.data); });
window.addEventListener('beforeunload', () => { if (winAlive()) win.close(); });

// ---------- navegação ----------
function go(n, fromRemote) {
  n = Math.max(0, Math.min(TOTAL - 1, n));
  const prevBlock = blockOf(st.idx + 1).id;
  st.idx = n;
  if (blockOf(n + 1).id !== prevBlock) st.blockEnter = elapsed();
  save();
  render();
  if (!fromRemote) sendToSlides();
}

// ---------- render ----------
function sec(cls, title, body) { return `<div class="sec ${cls}"><h2>${title}</h2>${body}</div>`; }
function render() {
  const n = st.idx, s = SLIDES[n], b = blockOf(n + 1);
  let html = `<div class="meta">
      <span class="chip blk-c">Bloco ${b.id} · ${esc(b.name)}</span>
      ${s.crit ? '<span class="chip crit">Slide crítico: não cortar</span>' : ''}
      <span class="chip time">~${slideMin(n).toFixed(1).replace('.', ',')} min</span></div>
    <h1><span class="n">${n + 1}.</span> ${esc(s.t)}</h1>`;
  if (s.key) html += sec('key', 'Mensagem-chave', `<p>${esc(s.key)}</p>`);
  html += sec('say', 'Fala', `<p>${esc(s.say)}</p>`);
  if (s.terms) html += sec('terms', 'Termos novos', `<dl>${s.terms.map(t => `<dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd>`).join('')}</dl>`);
  html += sec('visual', 'Visual no slide', `<p>${esc(s.visual)}</p>` + (s.extra ? `<ul>${s.extra.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''));
  $('notes').innerHTML = html;
  $('notes').scrollTop = 0;

  $('count').textContent = `${n + 1} / ${TOTAL}`;
  const nx = SLIDES[n + 1];
  $('nextTitle').textContent = nx ? `${n + 2}. ${nx.t}` : 'Fim da apresentação';
  setFrame($('curFrame'), n);
  setFrame($('nextFrame'), Math.min(n + 1, TOTAL - 1));

  // barra de blocos
  $('blocks').innerHTML = BLOCKS.map(x => {
    const cls = x.id < b.id ? 'done' : x.id === b.id ? 'cur' : '';
    const pct = x.id < b.id ? 100 : x.id === b.id ? ((n + 1 - x.from + 1) / (x.to - x.from + 1)) * 100 : 0;
    return `<div class="blk ${cls}" style="flex:${x.min}"><i style="width:${pct}%"></i></div>`;
  }).join('');
  $('blkLbl').innerHTML = BLOCKS.map(x => `<span class="${x.id === b.id ? 'cur' : ''}" style="flex:${x.min}">${x.id}. ${esc(x.name)}</span>`).join('');

  $('agenda').innerHTML = '<h2>Blocos</h2>' + BLOCKS.map(x =>
    `<button data-go="${x.from - 1}" class="${x.id === b.id ? 'cur' : ''}"><span>${x.id}. ${esc(x.name)}</span><span class="m">${x.min} min · ${x.from === x.to ? 'sl. ' + x.from : 'sl. ' + x.from + '–' + x.to}</span></button>`).join('');
  $('agenda').querySelectorAll('button').forEach(btn => btn.onclick = () => go(+btn.dataset.go));
  tick();
}

const frameState = new WeakMap();
function setFrame(f, n) {
  if (!frameState.has(f)) {
    f.src = `${SLIDES_URL}?embed=1&slide=${n + 1}`;
    frameState.set(f, n);
    return;
  }
  frameState.set(f, n);
  try { f.contentWindow.postMessage({ dsh: 'goto', idx: n }, '*'); } catch (e) {}
}
// garante o slide correto quando o iframe termina de carregar
['curFrame', 'nextFrame'].forEach(id => $(id).addEventListener('load', () => {
  const f = $(id); const n = frameState.get(f);
  if (n !== undefined) try { f.contentWindow.postMessage({ dsh: 'goto', idx: n }, '*'); } catch (e) {}
}));

function tick() {
  const now = new Date();
  $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const el = elapsed();
  $('elapsed').textContent = fmt(el);
  const rem = TOTAL_MIN * 60000 - el;
  const r = $('remaining');
  r.textContent = (rem < 0 ? '-' : '') + fmt(rem);
  r.className = 'val ' + (rem < 0 ? 'bad' : rem < 5 * 60000 ? 'warn' : '');

  const b = blockOf(st.idx + 1);
  const be = Math.max(0, el - st.blockEnter);
  const bt = $('blockTime');
  bt.textContent = `${fmtMS(be)} / ${b.min} min`;
  bt.className = 'val sm ' + (be > b.min * 60000 * 1.15 ? 'bad' : be > b.min * 60000 ? 'warn' : '');

  const p = $('pace');
  if (el === 0 && !running()) { p.textContent = 'não iniciado'; p.className = 'val sm'; return; }
  const diff = el - startMin[st.idx] * 60000; // >0: atrasado
  if (Math.abs(diff) < 60000) { p.textContent = 'no ritmo'; p.className = 'val sm good'; }
  else if (diff > 0) { p.textContent = `${fmtMS(diff)} atrasado`; p.className = 'val sm ' + (diff > 5 * 60000 ? 'bad' : 'warn'); }
  else { p.textContent = `${fmtMS(diff)} adiantado`; p.className = 'val sm good'; }
}
setInterval(tick, 250);

// ---------- eventos ----------
$('startBtn').onclick = () => running() ? pause() : start();
$('resetBtn').onclick = () => {
  if (!confirm('Zerar cronômetro e voltar ao slide 1?')) return;
  st = { idx: 0, acc: 0, since: null, blockEnter: 0 };
  save(); renderBtn(); render(); sendToSlides();
};
$('openBtn').onclick = openSlides;
$('prev').onclick = () => go(st.idx - 1);
$('next').onclick = () => { if (!running() && st.acc === 0 && st.idx === 0) start(); go(st.idx + 1); };

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); $('next').click(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(st.idx - 1); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(TOTAL - 1);
  else if (k === 's' || k === 'S') openSlides();
  else if (k === 'p' || k === 'P') running() ? pause() : start();
});

// clique no fundo avança; ignora controles, agenda, topo e seleção de texto
document.addEventListener('click', e => {
  if (e.target.closest('button, a, input, .top, .agenda, .nav, .blocks, .blk-lbl')) return;
  if (String(window.getSelection()).length > 0) return;
  $('next').click();
});

renderBtn();
render();
</script>
</body>
</html>
